apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-3d
  namespace: printing-system
  labels:
    app: api-3d
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-3d
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # ніколи не зменшуємо нижче replicas під час оновлення
      maxSurge: 1         # дозволяємо +1 под під час rolling update
  template:
    metadata:
      labels:
        app: api-3d
    spec:
      containers:
        - name: api-3d
          image: 3dprint-api:latest
          imagePullPolicy: Never  # для локального Docker Desktop; змінити на Always для registry
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: api-config

          env:
            - name: ConnectionStrings__DataContext
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ConnectionStrings__DataContext
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: Jwt__Key

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          # readinessProbe — pod отримує трафік тільки після успішної відповіді
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3

          # livenessProbe — k8s перезапускає pod якщо він зависає
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: data-storage
              mountPath: /data

      volumes:
        - name: data-storage
          persistentVolumeClaim:
            claimName: api-data-pvc
